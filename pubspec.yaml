name: smart_field_kit
description: "Flutter form fields on native Material behavior: validation, formatting, masking, phone, OTP, amount, card, and date inputs in one API."
version: 0.0.1
homepage: https://github.com/codewingz/smart_field_kit
repository: https://github.com/codewingz/smart_field_kit
issue_tracker: https://github.com/codewingz/smart_field_kit/issues
topics:
  - forms
  - input
  - validation
  - text-field
  - flutter
screenshots:
  - description: "Amount formatting: 50,000.00 displayed, 50000.00 raw value, and a percentage field."
    path: screenshots/amount_percentage_light.png
  - description: "Phone field with country picker and parsed E.164 value, dark theme."
    path: screenshots/phone_parsing_dark.png

platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  characters: ^1.4.1
  country_picker: ^2.0.28
  flutter:
    sdk: flutter
  flutter_native_contact_picker: ^0.0.13
  phone_numbers_parser: ^9.0.29

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
